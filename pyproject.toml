[project]
name = "arya-industrial-demo"
version = "0.1.0"
description = "ARYA Industrial Demo - planta simulada P-101 con OPC UA"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
