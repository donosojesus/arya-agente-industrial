<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="18%" cy="8%" r="95%"><stop offset="0" stop-color="#11244a"/><stop offset=".45" stop-color="#0a1226"/><stop offset="1" stop-color="#070b18"/></radialGradient>
    <radialGradient id="glow" cx="100%" cy="100%" r="45%"><stop offset="0" stop-color="#5a3a12" stop-opacity=".55"/><stop offset="1" stop-color="#5a3a12" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity=".07"/></pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/><rect width="1920" height="1080" fill="url(#glow)"/><rect width="1920" height="1080" fill="url(#dots)"/>
  <text x="70" y="68" font-size="22" font-weight="800" fill="#f39200" letter-spacing="6">DEL MODELO AL AGENTE</text>
  <text x="70" y="160" font-size="60" font-weight="800" fill="#ffffff">Anatomía de ARYA, un agente de IA industrial</text>
    <rect x="70" y="250" width="570" height="118" rx="10" fill="#101a33" stroke="#f39200" stroke-width="2"/>
  <g transform="translate(98 284)" fill="none" stroke="#f39200" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="14" r="6"/><circle cx="38" cy="10" r="6"/><circle cx="34" cy="38" r="6"/><circle cx="10" cy="38" r="5"/><path d="M18 13 L32 11 M37 16 L35 32 M16 18 L30 34 M11 20 L10 33 M15 38 H28"/></g>
  <text x="175" y="300" font-size="25" font-weight="700" fill="#ffffff">Modelo</text>
  <text x="175" y="334" font-size="17" fill="#aeb9c9">NVIDIA Nemotron, local en la Dell Pro Max GB10</text>
  <rect x="70" y="390" width="570" height="118" rx="10" fill="#101a33" stroke="#f39200" stroke-width="2"/>
  <g transform="translate(98 424)" fill="none" stroke="#f39200" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6 H38 V44 H12 Z M18 16 H32 M18 24 H32 M18 32 H27"/></g>
  <text x="175" y="440" font-size="25" font-weight="700" fill="#ffffff">Prompt de sistema</text>
  <text x="175" y="474" font-size="17" fill="#aeb9c9">5 reglas: solo lectura, no inventar, citar fuentes</text>
  <rect x="70" y="530" width="570" height="118" rx="10" fill="#101a33" stroke="#f39200" stroke-width="2"/>
  <g transform="translate(98 564)" fill="none" stroke="#f39200" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="8" width="38" height="34" rx="3"/><path d="M6 18 H44 M20 18 V42"/></g>
  <text x="175" y="580" font-size="25" font-weight="700" fill="#ffffff">Ventana de contexto</text>
  <text x="175" y="614" font-size="17" fill="#aeb9c9">Reglas, conversación, herramientas y sus resultados</text>
  <rect x="70" y="670" width="570" height="118" rx="10" fill="#101a33" stroke="#f39200" stroke-width="2"/>
  <g transform="translate(98 704)" fill="none" stroke="#f39200" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="26" cy="26" r="18"/><path d="M26 15 V26 L34 31 M5 14 V24 H15"/></g>
  <text x="175" y="714" font-size="25" font-weight="700" fill="#ffffff">Memoria</text>
  <text x="175" y="742" font-size="17" fill="#aeb9c9">Corto plazo: la conversación en curso</text>
  <text x="175" y="765" font-size="17" fill="#aeb9c9">Largo plazo: incidentes y decisiones humanas</text>
  <rect x="70" y="810" width="570" height="118" rx="10" fill="#101a33" stroke="#f39200" stroke-width="2"/>
  <g transform="translate(98 844)" fill="none" stroke="#f39200" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M25 12 C19 7 11 7 6 9 V40 C11 38 19 38 25 43 C31 38 39 38 44 40 V9 C39 7 31 7 25 12 Z M25 12 V43"/></g>
  <text x="175" y="860" font-size="25" font-weight="700" fill="#ffffff">RAG</text>
  <text x="175" y="894" font-size="17" fill="#aeb9c9">Manuales y procedimientos de la planta, con cita</text>
  <rect x="1280" y="250" width="570" height="118" rx="10" fill="#101a33" stroke="#f39200" stroke-width="2"/>
  <g transform="translate(1308 284)" fill="none" stroke="#f39200" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 25 C12 12 38 12 46 25 C38 38 12 38 4 25 Z"/><circle cx="25" cy="25" r="6"/></g>
  <text x="1385" y="294" font-size="25" font-weight="700" fill="#ffffff">Percepción</text>
  <text x="1385" y="322" font-size="17" fill="#aeb9c9">Señales y alarmas de la planta por OPC UA,</text>
  <text x="1385" y="345" font-size="17" fill="#aeb9c9">y las preguntas del operador</text>
  <rect x="1280" y="390" width="570" height="118" rx="10" fill="#101a33" stroke="#f39200" stroke-width="2"/>
  <g transform="translate(1308 424)" fill="none" stroke="#f39200" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M41 9 A10 10 0 1 0 28 22 L9 41 A3.5 3.5 0 0 0 14 46 L33 27 A10 10 0 0 0 46 14 L39 21 L34 16 Z"/></g>
  <text x="1385" y="440" font-size="25" font-weight="700" fill="#ffffff">Herramientas</text>
  <text x="1385" y="474" font-size="17" fill="#aeb9c9">10 funciones: consulta sistemas y prepara órdenes</text>
  <rect x="1280" y="530" width="570" height="118" rx="10" fill="#101a33" stroke="#5d6a80" stroke-width="2" stroke-dasharray="7 6"/>
  <g transform="translate(1308 564)" fill="none" stroke="#8090a6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 5 V15 M33 5 V15 M11 15 H39 V24 A14 14 0 0 1 11 24 Z M25 38 V47"/></g>
  <text x="1385" y="580" font-size="25" font-weight="700" fill="#aab4c4">MCP</text>
  <text x="1385" y="614" font-size="17" fill="#8090a6">Estándar abierto para conectar herramientas y datos</text>
  <rect x="1640" y="552" width="190" height="34" rx="17" fill="none" stroke="#8090a6" stroke-width="1.5"/>
  <text x="1735" y="575" text-anchor="middle" font-size="14" font-weight="700" fill="#aab4c4" letter-spacing="1">NO EN ESTA DEMO</text>
  <rect x="1280" y="670" width="570" height="118" rx="10" fill="#101a33" stroke="#f39200" stroke-width="2"/>
  <g transform="translate(1308 704)" fill="none" stroke="#f39200" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M25 5 L43 11 V25 C43 35 35 43 25 46 C15 43 7 35 7 25 V11 Z M17 25 L23 31 L34 19"/></g>
  <text x="1385" y="720" font-size="25" font-weight="700" fill="#ffffff">Guardrails y control humano</text>
  <text x="1385" y="754" font-size="17" fill="#aeb9c9">Límites en el código; solo una persona aprueba</text>
  <rect x="1280" y="810" width="570" height="118" rx="10" fill="#101a33" stroke="#f39200" stroke-width="2"/>
  <g transform="translate(1308 844)" fill="none" stroke="#f39200" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 38 A20 20 0 1 1 43 38 M25 28 L35 17"/><circle cx="25" cy="29" r="3"/></g>
  <text x="1385" y="860" font-size="25" font-weight="700" fill="#ffffff">Observabilidad</text>
  <text x="1385" y="894" font-size="17" fill="#aeb9c9">Qué hizo, sus fuentes, tiempos y tokens</text>
  <circle cx="960" cy="590" r="215" fill="none" stroke="#f39200" stroke-width="2.5" stroke-dasharray="12 10"/>
  <circle cx="960" cy="590" r="106" fill="#f39200"/>
  <text x="960" y="601" text-anchor="middle" font-size="34" font-weight="800" fill="#0a1226" letter-spacing="8">ARYA</text>
  <circle cx="960" cy="375" r="74" fill="#0a1226" stroke="#f39200" stroke-width="2.5"/><text x="960" y="367" text-anchor="middle" font-size="24" font-weight="800" fill="#f39200">1</text><text x="960" y="395" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Percibir</text>
  <circle cx="1175" cy="590" r="74" fill="#0a1226" stroke="#f39200" stroke-width="2.5"/><text x="1175" y="582" text-anchor="middle" font-size="24" font-weight="800" fill="#f39200">2</text><text x="1175" y="610" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Razonar</text>
  <circle cx="960" cy="805" r="74" fill="#0a1226" stroke="#f39200" stroke-width="2.5"/><text x="960" y="797" text-anchor="middle" font-size="24" font-weight="800" fill="#f39200">3</text><text x="960" y="825" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Actuar</text>
  <circle cx="745" cy="590" r="74" fill="#0a1226" stroke="#f39200" stroke-width="2.5"/><text x="745" y="582" text-anchor="middle" font-size="24" font-weight="800" fill="#f39200">4</text><text x="745" y="610" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Observar</text>
  <text x="960" y="917" text-anchor="middle" font-size="18" font-weight="700" fill="#f39200">Consulta y propone; no opera equipos</text>
  <text x="960" y="947" text-anchor="middle" font-size="18" font-style="italic" fill="#aeb9c9">Un ciclo que se repite hasta responder, con límite</text>
  <text x="960" y="1004" text-anchor="middle" font-size="23" fill="#ffffff">ARYA reúne estas piezas en un solo agente que corre en vivo, de forma local y sin Internet.</text>
  <text x="70" y="1050" font-size="15" fill="#8090a6">ARYA · Demo industrial</text>
</svg>
